name: Weekly check
# Once a week, checks everything this fork depends on:
#
# - GitHub Actions: finds newer versions of the actions the workflows use
#   (macos/scripts/check_updates.py) and lists them. GitHub doesn't let the
#   built-in token edit workflows, so they're applied by the weekly
#   maintenance, or here when a MAINTENANCE_TOKEN secret is set: a
#   fine-grained personal access token for this repository with Contents and
#   Workflows set to "Read and write". The same script finds newer Python,
#   PySide6 and pip releases for the Windows app.
# - Dependencies: audits the packages the Windows app ships and MVT's locked
#   packages for known vulnerabilities (macos/scripts/audit_dependencies.py).
#   Only one in a package this fork pins fails the run. The rest are
#   warnings: uv.lock and MVT's pins come from upstream, so their fixes
#   arrive with the daily sync and the next MVT release.
# - The MVT release people install: checks the latest MVT on PyPI still has
#   everything the app uses.
# - The upstream sync: fails if the fork has fallen behind mvt-project/mvt.
# - The apps: builds the Mac app with the newest Xcode on GitHub's macOS
#   runners, and the Windows app with the newest MVT from PyPI.
# - Keeps the scheduled workflows on. GitHub turns off schedules in a public
#   repository after 60 days without activity, which a quiet stretch upstream
#   would cause.
#
# Anything that needs attention fails the run, so GitHub emails you. Each
# run's summary lists what was found.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-check

env:
  BASE_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}

jobs:
  actions:
    name: GitHub Actions and Windows runtime versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ secrets.MAINTENANCE_TOKEN || github.token }}

      - name: Find newer versions
        id: check
        run: python3 macos/scripts/check_updates.py --apply | tee "$RUNNER_TEMP/updates.md"

      - name: Check the updated workflows
        if: steps.check.outputs.outdated != '0'
        run: |
          bash <(curl -sSfL --retry 4 --retry-all-errors https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Push the updates
        if: steps.check.outputs.outdated != '0'
        env:
          HAS_TOKEN: ${{ secrets.MAINTENANCE_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::Updates are available (listed in the summary). Without a MAINTENANCE_TOKEN secret they're left for the weekly maintenance to apply."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Apply the weekly updates" -m "$(grep '^- ' "$RUNNER_TEMP/updates.md")"
          git push origin "HEAD:${BASE_BRANCH}"
          echo "Pushed the updates to \`${BASE_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Audit the Windows app's packages and uv.lock
        run: python3 macos/scripts/audit_dependencies.py

  pypi-release:
    name: Latest MVT release works with the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install MVT from PyPI
        run: |
          # The exact newest release, so the check never quietly runs an older one.
          latest=$(curl -sSf --retry 4 --retry-all-errors https://pypi.org/pypi/mvt/json | python -c "import json, sys; print(json.load(sys.stdin)['info']['version'])")
          pip install "mvt==${latest}"
          echo "### MVT on PyPI" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked MVT ${latest}." >> "$GITHUB_STEP_SUMMARY"
      - name: Check CLI contract
        run: python macos/scripts/check_cli_contract.py

  sync:
    name: Upstream sync is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
      - name: Compare with mvt-project/mvt
        run: |
          for attempt in 1 2 3 4; do
            git fetch --no-tags https://github.com/mvt-project/mvt.git +refs/heads/main:refs/remotes/upstream/main && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 15))
          done
          behind=$(git rev-list --count "$(cat .github/upstream-commit)..upstream/main")
          newest=$(git log -1 --format=%ct upstream/main)
          echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${BASE_BRANCH}\` is ${behind} commit(s) behind mvt-project/mvt." >> "$GITHUB_STEP_SUMMARY"
          # The daily sync gets a day's grace for commits made since it last ran.
          if [ "$behind" != "0" ] && [ $(( $(date +%s) - newest )) -gt 172800 ]; then
            echo "::error::The fork is behind mvt-project/mvt. Check the Sync upstream runs."
            exit 1
          fi

  keepalive:
    name: Keep the schedules on
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-enable the scheduled workflows
        run: |
          for workflow in sync-upstream.yml weekly-check.yml; do
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable" --silent \
              || echo "::warning::Couldn't re-enable ${workflow}."
          done

  build:
    name: App
    uses: ./.github/workflows/macos-gui.yml

  windows:
    name: Windows app
    uses: ./.github/workflows/windows-app.yml

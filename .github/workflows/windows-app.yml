name: Windows app
# Tests the Windows app, builds the portable folder on Windows and tries it:
# MVT checks the test backup with the app's own Python, and the app opens
# from "MVT for Windows.exe" and saves a picture of its Results screen.

on:
  push:
    paths:
      - "windows/**"
      - "src/**"
      - "pyproject.toml"
      - "macos/scripts/check_cli_contract.py"
      - ".github/workflows/windows-app.yml"
  pull_request:
    paths:
      - "windows/**"
      - "src/**"
      - "pyproject.toml"
      - "macos/scripts/check_cli_contract.py"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:
  # Also run by the weekly check and the release.
  workflow_call:
    inputs:
      version:
        description: The app's version (defaults to windows/mvtwin/__init__.py)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Test the app on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm derives the version from git history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install MVT from this checkout, Qt and pytest
        run: |
          $pyside = (Select-String -Path windows/scripts/build_portable.py -Pattern 'PYSIDE_VERSION = "(.*)"').Matches[0].Groups[1].Value
          python -m pip install --quiet . "PySide6-Essentials==$pyside" pytest
      - name: Run the tests
        working-directory: windows
        run: python -m pytest -v

  build:
    name: Build the portable app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install --quiet pefile
          $version = "${{ inputs.version }}"
          if ($version) { python windows/scripts/build_portable.py --version $version }
          else { python windows/scripts/build_portable.py }

      - name: Check the signatures Windows sees
        run: |
          $app = "dist/MVT for Windows"
          foreach ($file in @("MVT for Windows.exe", "python.exe", "python314.dll", "Lib/site-packages/PySide6/Qt6Core.dll")) {
            $signature = Get-AuthenticodeSignature -FilePath (Join-Path $app $file)
            "{0}: {1} ({2})" -f $file, $signature.Status, $signature.SignerCertificate.Subject
            if ($signature.Status -ne "Valid") { throw "$file isn't validly signed" }
          }

      - name: Run MVT with the app's Python
        run: |
          $python = "dist/MVT for Windows/python.exe"
          $out = "$env:RUNNER_TEMP/Results"
          & $python -c "import sys; sys.argv[0] = 'mvt-ios'; from mvt.ios import main; sys.exit(main())" `
            --disable-update-check --disable-indicator-update-check check-backup `
            --iocs tests/artifacts/stix2/cytrox.stix2 --output $out tests/artifacts/ios_backup
          if ($LASTEXITCODE -ne 0) { throw "check-backup failed" }
          if (-not (Test-Path "$out/alerts.json")) { throw "no alerts.json" }
          $alerts = Get-Content "$out/alerts.json" -Raw | ConvertFrom-Json
          "check-backup wrote $($alerts.Count) alerts"
          if ($alerts.Count -lt 1) { throw "no alerts for the test backup" }

      - name: Open the app with its Python
        run: |
          $app = Resolve-Path "dist/MVT for Windows"
          & "$app/python.exe" -c "import sys, sitecustomize; print(sys.executable); print(sys.path); print(sitecustomize.__file__)"
          if ($LASTEXITCODE -ne 0) { throw "the app's Python can't find its modules" }
          # The console python.exe shows any error while the window opens.
          $env:MVTWIN_SCREENSHOT_DELAY = "5"
          & "$app/python.exe" -m mvtwin -screenshot "$env:RUNNER_TEMP/python-start.png"
          if (-not (Test-Path "$env:RUNNER_TEMP/python-start.png")) { throw "the app didn't open with python.exe" }
          Remove-Item -Recurse -Force "$app/Data" -ErrorAction SilentlyContinue

      - name: Open the app from its executable
        run: |
          $app = Resolve-Path "dist/MVT for Windows"
          $shots = "$env:RUNNER_TEMP\screenshots"
          New-Item -ItemType Directory -Force $shots | Out-Null
          $env:MVTWIN_SCREENSHOT_DELAY = "12"

          # A double-click: the launcher starts the app and exits straight away.
          $env:MVTWIN_SCREENSHOT = "$shots\setup.png"
          Start-Process -FilePath "$app\MVT for Windows.exe"
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $env:MVTWIN_SCREENSHOT) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $env:MVTWIN_SCREENSHOT)) {
            Get-Content "$app\Data\error.log", "$app\launch-error.log" -ErrorAction SilentlyContinue
            throw "The app didn't open from MVT for Windows.exe"
          }
          Remove-Item Env:MVTWIN_SCREENSHOT
          Start-Sleep -Seconds 3

          # The other screens, opened with options through python.exe.
          $screens = @(
            @("indicators", "-startScreen", "indicators"),
            @("check-backup", "-startScreen", "iosCheckBackup", "-inputPath", "$PWD\tests\artifacts\ios_backup", "-outputPath", "$env:RUNNER_TEMP\Results"),
            @("results", "-startScreen", "results", "-resultsFolder", "$env:RUNNER_TEMP\Results"),
            @("results-dark", "-startScreen", "results", "-resultsFolder", "$env:RUNNER_TEMP\Results", "-appearance", "dark")
          )
          foreach ($screen in $screens) {
            $png = "$shots\$($screen[0]).png"
            $options = $screen[1..($screen.Length - 1)]
            & "$app\python.exe" -m mvtwin @options -screenshot $png
            if (-not (Test-Path $png)) { throw "The app didn't open ($($screen[0]))" }
          }
          Get-ChildItem $shots | Format-Table Name, Length
          # Leave the folder as it was built.
          Remove-Item -Recurse -Force "$app\Data" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}/screenshots

      - uses: actions/upload-artifact@v7
        with:
          name: MVT-for-Windows
          path: dist/MVT-for-Windows-*.zip

name: Release apps
# Builds the macOS app and the portable Windows app and publishes them as one
# GitHub release, either when a
# gui-v* tag is pushed (e.g. gui-v3.0.0-alpha) or when started from the
# Actions tab with a version, which tags the chosen commit. Tags containing alpha, beta or rc
# are marked as pre-releases. The tags are prefixed so they never mix with
# MVT's own v* release tags, which set MVT's version number.

on:
  push:
    tags: ["gui-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 3.0.0-alpha (tagged gui-v<version>)
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows app
    uses: ./.github/workflows/windows-app.yml
    with:
      version: ${{ inputs.version || github.ref_name }}

  release:
    name: Build and publish
    needs: windows
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.version && format('gui-v{0}', inputs.version) || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          xcodebuild \
            -project macos/MVTGUI.xcodeproj \
            -scheme MVTGUI \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Package
        run: |
          version="${TAG#gui-v}"
          app="build/DerivedData/Build/Products/Release/MVTGUI.app"
          mkdir -p dist
          # The license and notices travel with the app.
          stage="$RUNNER_TEMP/MVT-GUI-${version}"
          mkdir -p "$stage"
          cp -R "$app" LICENSE NOTICE "$stage/"
          ditto -c -k --keepParent "$stage" "dist/MVT-GUI-${version}-macOS.zip"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: MVT-for-Windows
          path: dist

      - name: Checksums
        run: |
          (cd dist && shasum -a 256 ./*.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish release
        run: |
          prerelease=()
          case "$TAG" in *alpha*|*beta*|*rc*) prerelease=(--prerelease) ;; esac
          title="MVT GUI ${VERSION}"
          # Pre-releases are titled by major version: 3.0.0-alpha is
          # "MVT GUI V3-Alpha" and 3.0.1-alpha is "MVT GUI V3-Alpha (3.0.1)".
          case "$VERSION" in
            *-*)
              pre="${VERSION#*-}"
              number="${VERSION%%-*}"
              title="MVT GUI V${VERSION%%.*}-$(echo "${pre:0:1}" | tr '[:lower:]' '[:upper:]')${pre:1}"
              case "$number" in *.0.0) ;; *) title="$title ($number)" ;; esac
              ;;
          esac
          cat > notes.md <<NOTES
          Mac and Windows apps for the Mobile Verification Toolkit (MVT).

          **Mac** (macOS 13 or newer)
          1. Download \`MVT-GUI-${VERSION}-macOS.zip\` below and unzip it.
          2. Open the \`MVT-GUI-${VERSION}\` folder and move \`MVTGUI.app\` to Applications.
          3. The app isn't notarized: the first time, right-click it and choose **Open**, then **Open** again.
          4. In the app, open **Setup** to install or update MVT, then **Indicators** to download indicators.

          **Windows** (Windows 10 or 11, 64-bit; portable, MVT included)
          1. Download \`MVT-for-Windows-${VERSION}.zip\` below and unzip it into Documents, Desktop or a USB drive.
          2. Open the \`MVT for Windows\` folder and double-click \`MVT for Windows.exe\`. Nothing is installed.
          3. In the app, open **Indicators** to download indicators.

          See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/README.md) for instructions. Check files against \`SHA256SUMS.txt\`.

          MVT is for the consensual analysis of devices only; public indicators can't prove a device is clean.

          Licensed under the [MVT License 1.1](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/LICENSE); see [NOTICE](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/NOTICE). Source code: [${TAG}](https://github.com/${GITHUB_REPOSITORY}/tree/${TAG}).
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${prerelease[@]}" --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes.md
          fi

name: Remove the Mac downloads
# One-off: the Mac app is now sold on the Mac App Store, so the Mac zips come
# off every public release, and each release's SHA256SUMS.txt drops their
# lines. The zips are kept for 90 days as this run's artifact first (the
# private source repository keeps its own copies). Delete this file after
# it has run.

on:
  push:
    branches: [main]
    paths: [".github/workflows/remove-mac-downloads.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the Mac zips
        run: |
          mkdir -p mac
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern '*-macOS.zip' --dir "mac/$tag" 2> /dev/null || true
          done
          find mac -type f | sort
      - uses: actions/upload-artifact@v7
        with:
          name: mac-downloads-${{ github.run_id }}
          path: mac
          retention-days: 90
          if-no-files-found: ignore
      - name: Remove them from the releases
        run: |
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            names=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for name in $names; do
              case "$name" in
                *-macOS.zip)
                  gh release delete-asset "$tag" "$name" -R "$GITHUB_REPOSITORY" --yes
                  echo "$tag: removed $name"
                  ;;
              esac
            done
            if echo "$names" | grep -qx 'SHA256SUMS.txt'; then
              rm -rf sums && mkdir sums
              gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS.txt' --dir sums
              if grep -q 'macOS' sums/SHA256SUMS.txt; then
                grep -v 'macOS' sums/SHA256SUMS.txt > sums/new.txt || true
                if [ -s sums/new.txt ]; then
                  mv sums/new.txt sums/SHA256SUMS.txt
                  gh release upload "$tag" sums/SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
                  echo "$tag: SHA256SUMS.txt updated"
                else
                  # It only listed the Mac zip.
                  gh release delete-asset "$tag" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --yes
                  echo "$tag: SHA256SUMS.txt removed"
                fi
              fi
            fi
          done
          echo "Mac zips left:"
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -- '-macOS.zip' || true
          done
